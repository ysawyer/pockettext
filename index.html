<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PocketText</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --bg: #0d0d0f;
        --surface: #161618;
        --surface2: #1e1e21;
        --border: #2a2a2e;
        --accent: #7fff6a;
        --accent2: #3effc8;
        --text: #f0f0f2;
        --muted: #6b6b72;
        --radius: 18px;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Syne", sans-serif;
        background: var(--bg);
        color: var(--text);
        height: 100vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      .screen {
        display: none;
        flex-direction: column;
        height: 100vh;
      }
      .screen.active {
        display: flex;
      }

      #auth-screen {
        align-items: center;
        justify-content: center;
        background: var(--bg);
        position: relative;
        overflow: hidden;
      }

      .grid-bg {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(var(--border) 1px, transparent 1px),
          linear-gradient(90deg, var(--border) 1px, transparent 1px);
        background-size: 40px 40px;
        opacity: 0.4;
      }

      .auth-card {
        position: relative;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 24px;
        padding: 48px 40px;
        width: 360px;
        max-width: 90vw;
        animation: fadeUp 0.5s ease;
      }

      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .logo {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 32px;
      }

      .logo-icon {
        width: 40px;
        height: 40px;
        background: var(--accent);
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
      }

      .logo-text {
        font-size: 22px;
        font-weight: 800;
        letter-spacing: -0.5px;
        color: var(--text);
      }

      .logo-text span {
        color: var(--accent);
      }

      .auth-title {
        font-size: 26px;
        font-weight: 700;
        margin-bottom: 6px;
        letter-spacing: -0.5px;
      }

      .auth-sub {
        color: var(--muted);
        font-size: 14px;
        margin-bottom: 28px;
      }

      label {
        display: block;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 1px;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 8px;
      }

      input[type="text"],
      input[type="password"] {
        width: 100%;
        background: var(--surface2);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 12px 16px;
        color: var(--text);
        font-family: "DM Mono", monospace;
        font-size: 14px;
        outline: none;
        transition: border-color 0.2s;
        margin-bottom: 18px;
      }

      input:focus {
        border-color: var(--accent);
      }

      .btn {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 12px;
        font-family: "Syne", sans-serif;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.15s;
        letter-spacing: 0.3px;
      }

      .btn-primary {
        background: var(--accent);
        color: #0d0d0f;
      }

      .btn-primary:hover {
        background: #a8ffaa;
        transform: translateY(-1px);
      }
      .btn-primary:active {
        transform: translateY(0);
      }

      .btn-ghost {
        background: transparent;
        color: var(--muted);
        border: 1px solid var(--border);
        margin-top: 10px;
      }

      .btn-ghost:hover {
        border-color: var(--text);
        color: var(--text);
      }

      .error-msg {
        color: #ff6b6b;
        font-size: 13px;
        margin-bottom: 12px;
        min-height: 18px;
      }

      #app-screen {
        flex-direction: row;
      }

      .sidebar {
        width: 300px;
        min-width: 300px;
        background: var(--surface);
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
      }

      .sidebar-header {
        padding: 20px 20px 16px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .sidebar-logo {
        font-size: 18px;
        font-weight: 800;
        letter-spacing: -0.3px;
      }
      .sidebar-logo span {
        color: var(--accent);
      }

      .my-number {
        font-family: "DM Mono", monospace;
        font-size: 13px;
        color: var(--accent);
        background: rgba(127, 255, 106, 0.1);
        border: 1px solid rgba(127, 255, 106, 0.3);
        border-radius: 20px;
        padding: 4px 10px;
      }

      .sidebar-tabs {
        display: flex;
        border-bottom: 1px solid var(--border);
      }

      .tab-btn {
        flex: 1;
        padding: 12px;
        background: none;
        border: none;
        color: var(--muted);
        font-family: "Syne", sans-serif;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.15s;
        border-bottom: 2px solid transparent;
        letter-spacing: 0.3px;
      }

      .tab-btn.active {
        color: var(--accent);
        border-bottom-color: var(--accent);
      }
      .tab-btn:hover:not(.active) {
        color: var(--text);
      }

      .sidebar-content {
        flex: 1;
        overflow-y: auto;
        padding: 12px;
      }

      .contact-item {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 12px;
        border-radius: 12px;
        cursor: pointer;
        transition: background 0.15s;
        position: relative;
      }

      .contact-item:hover {
        background: var(--surface2);
      }
      .contact-item.active {
        background: var(--surface2);
      }

      .avatar {
        width: 42px;
        height: 42px;
        border-radius: 12px;
        background: var(--surface2);
        border: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
        font-weight: 700;
        color: var(--accent);
        flex-shrink: 0;
      }

      .contact-info {
        flex: 1;
        min-width: 0;
      }

      .contact-name {
        font-size: 14px;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .contact-num {
        font-family: "DM Mono", monospace;
        font-size: 12px;
        color: var(--muted);
      }

      .contact-preview {
        font-size: 12px;
        color: var(--muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .unread-badge {
        background: var(--accent);
        color: #0d0d0f;
        border-radius: 10px;
        font-size: 11px;
        font-weight: 700;
        min-width: 20px;
        height: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 5px;
      }

      .add-contact-btn {
        width: 100%;
        padding: 10px;
        background: rgba(127, 255, 106, 0.08);
        border: 1px dashed rgba(127, 255, 106, 0.3);
        border-radius: 12px;
        color: var(--accent);
        font-family: "Syne", sans-serif;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.15s;
        margin-top: 8px;
      }

      .add-contact-btn:hover {
        background: rgba(127, 255, 106, 0.15);
        border-color: var(--accent);
      }

      .chat-panel {
        flex: 1;
        display: flex;
        flex-direction: column;
        background: var(--bg);
      }

      .chat-header {
        padding: 16px 24px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        gap: 14px;
        background: var(--surface);
      }

      .chat-header-info {
        flex: 1;
      }
      .chat-contact-name {
        font-size: 16px;
        font-weight: 700;
      }
      .chat-contact-num {
        font-family: "DM Mono", monospace;
        font-size: 12px;
        color: var(--muted);
      }

      .chat-messages {
        flex: 1;
        overflow-y: auto;
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        scroll-behavior: smooth;
      }

      .chat-messages::-webkit-scrollbar {
        width: 4px;
      }
      .chat-messages::-webkit-scrollbar-track {
        background: transparent;
      }
      .chat-messages::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: 2px;
      }

      .msg-row {
        display: flex;
        align-items: flex-end;
        gap: 8px;
        max-width: 70%;
      }

      .msg-row.outgoing {
        align-self: flex-end;
        flex-direction: row-reverse;
      }
      .msg-row.incoming {
        align-self: flex-start;
      }

      .bubble {
        padding: 10px 14px;
        border-radius: 16px;
        font-size: 14px;
        line-height: 1.5;
        word-break: break-word;
        max-width: 100%;
        overflow: hidden;
      }

      .outgoing .bubble {
        background: var(--accent);
        color: #0d0d0f;
        border-bottom-right-radius: 4px;
      }

      .incoming .bubble {
        background: var(--surface2);
        color: var(--text);
        border: 1px solid var(--border);
        border-bottom-left-radius: 4px;
      }

      .msg-time {
        font-size: 10px;
        color: var(--muted);
        font-family: "DM Mono", monospace;
        white-space: nowrap;
        margin-bottom: 2px;
      }

      .chat-input-stack {
        border-top: 1px solid var(--border);
        background: var(--surface);
      }

      .attachment-preview {
        padding: 12px 24px 0;
      }

      .attachment-chip {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        background: var(--surface2);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 10px 12px;
        max-width: 100%;
      }

      .attachment-thumb {
        width: 44px;
        height: 44px;
        border-radius: 10px;
        object-fit: cover;
        border: 1px solid var(--border);
        flex-shrink: 0;
      }

      .attachment-meta {
        min-width: 0;
        flex: 1;
      }

      .attachment-name {
        font-size: 13px;
        font-weight: 700;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .attachment-sub {
        font-size: 11px;
        color: var(--muted);
        font-family: "DM Mono", monospace;
      }

      .attachment-remove {
        border: none;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        font-size: 18px;
        line-height: 1;
        padding: 0 4px;
      }

      .chat-input-area {
        padding: 16px 24px 18px;
        display: flex;
        gap: 12px;
        align-items: flex-end;
        background: var(--surface);
      }

      .chat-input-wrap {
        flex: 1;
        display: flex;
        gap: 10px;
        align-items: flex-end;
        background: var(--surface2);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 10px 12px;
      }

      .attach-btn {
        width: 36px;
        height: 36px;
        border: 1px solid var(--border);
        background: var(--bg);
        color: var(--text);
        border-radius: 12px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        transition: all 0.15s;
      }

      .attach-btn:hover {
        border-color: var(--accent);
        color: var(--accent);
      }

      .chat-input {
        flex: 1;
        background: transparent;
        border: none;
        color: var(--text);
        font-family: "Syne", sans-serif;
        font-size: 14px;
        outline: none;
        resize: none;
        max-height: 120px;
        line-height: 1.5;
        padding: 6px 4px;
      }

      .send-btn {
        width: 46px;
        height: 46px;
        background: var(--accent);
        border: none;
        border-radius: 12px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.15s;
        flex-shrink: 0;
      }

      .send-btn:hover {
        background: #a8ffaa;
        transform: scale(1.05);
      }
      .send-btn:active {
        transform: scale(0.97);
      }
      .send-btn svg {
        color: #0d0d0f;
      }

      .empty-state {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: var(--muted);
        gap: 12px;
        text-align: center;
        padding: 40px;
      }

      .empty-icon {
        font-size: 48px;
        opacity: 0.5;
      }
      .empty-title {
        font-size: 18px;
        font-weight: 700;
        color: var(--text);
      }
      .empty-sub {
        font-size: 14px;
        max-width: 280px;
      }

      .modal-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.7);
        backdrop-filter: blur(6px);
        z-index: 100;
        align-items: center;
        justify-content: center;
      }

      .modal-overlay.open {
        display: flex;
      }

      .modal {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 32px;
        width: 340px;
        max-width: 90vw;
        animation: fadeUp 0.25s ease;
      }

      .modal h3 {
        font-size: 20px;
        font-weight: 700;
        margin-bottom: 20px;
      }

      .modal-actions {
        display: flex;
        gap: 10px;
        margin-top: 20px;
      }
      .modal-actions .btn {
        flex: 1;
      }

      .btn-sm {
        padding: 10px 16px;
        font-size: 13px;
      }

      .sidebar-content::-webkit-scrollbar {
        width: 4px;
      }
      .sidebar-content::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: 2px;
      }

      .toast {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%) translateY(60px);
        background: var(--surface2);
        border: 1px solid var(--border);
        border-radius: 100px;
        padding: 10px 20px;
        font-size: 13px;
        color: var(--text);
        transition: transform 0.3s ease;
        z-index: 200;
        white-space: nowrap;
      }

      .toast.show {
        transform: translateX(-50%) translateY(0);
      }

      .date-divider {
        display: flex;
        align-items: center;
        gap: 12px;
        color: var(--muted);
        font-size: 11px;
        font-family: "DM Mono", monospace;
        margin: 8px 0;
      }

      .date-divider::before,
      .date-divider::after {
        content: "";
        flex: 1;
        border-top: 1px solid var(--border);
      }

      .online-dot {
        width: 8px;
        height: 8px;
        background: var(--accent);
        border-radius: 50%;
        animation: pulse 2s infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.4;
        }
      }

      .message-text {
        white-space: pre-wrap;
        word-break: break-word;
      }

      .message-link {
        color: inherit;
        font-weight: 700;
        text-decoration: none;
        background: rgba(127, 255, 106, 0.16);
        border: 1px solid rgba(127, 255, 106, 0.3);
        border-radius: 10px;
        padding: 0 6px;
        display: inline-block;
      }

      .incoming .message-link {
        color: var(--accent);
        background: rgba(127, 255, 106, 0.08);
      }

      .link-preview {
        margin-top: 10px;
        border-radius: 14px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.08);
        background: rgba(0, 0, 0, 0.08);
        max-width: 100%;
      }

      .incoming .link-preview {
        background: var(--bg);
        border-color: var(--border);
      }

      .link-preview-image {
        width: 100%;
        max-height: 180px;
        object-fit: cover;
        display: block;
        background: #0b0b0b;
      }

      .link-preview-body {
        padding: 12px;
      }

      .link-preview-domain {
        font-size: 11px;
        letter-spacing: 0.4px;
        text-transform: uppercase;
        opacity: 0.8;
        margin-bottom: 4px;
        font-family: "DM Mono", monospace;
      }

      .link-preview-title {
        font-size: 14px;
        font-weight: 700;
        line-height: 1.35;
        margin-bottom: 4px;
      }

      .link-preview-desc {
        font-size: 12px;
        line-height: 1.4;
        opacity: 0.9;
      }

      .image-message {
        display: block;
        width: 100%;
        border-radius: 14px;
        max-width: 320px;
        max-height: 360px;
        object-fit: cover;
        background: #0b0b0b;
        border: 1px solid rgba(255, 255, 255, 0.08);
      }

      .incoming .image-message {
        border-color: var(--border);
      }

      .caption-spacer {
        height: 8px;
      }

      @media (max-width: 640px) {
        .sidebar {
          width: 100%;
          min-width: unset;
        }
        #app-screen {
          flex-direction: column;
        }
        .chat-panel {
          display: none;
        }
        .chat-panel.mobile-open {
          display: flex;
          position: fixed;
          inset: 0;
          z-index: 50;
        }
        .sidebar.mobile-hidden {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="auth-screen" class="screen active">
      <div class="grid-bg"></div>
      <div class="auth-card" id="login-card">
        <div class="logo">
          <div class="logo-icon">💬</div>
          <div class="logo-text">Pocket<span>Text</span></div>
        </div>
        <div class="auth-title">Welcome back</div>
        <div class="auth-sub">Sign in to your PocketText account</div>
        <div class="error-msg" id="login-error"></div>
        <label>Username</label>
        <input
          type="text"
          id="login-username"
          placeholder="your_username"
          autocomplete="username"
        />
        <label>Password</label>
        <input
          type="password"
          id="login-password"
          placeholder="••••••••"
          autocomplete="current-password"
        />
        <button class="btn btn-primary" onclick="loginUser()">Sign In</button>
        <button class="btn btn-ghost" onclick="showRegister()">
          Create new account →
        </button>
      </div>

      <div class="auth-card" id="register-card" style="display: none">
        <div class="logo">
          <div class="logo-icon">💬</div>
          <div class="logo-text">Pocket<span>Text</span></div>
        </div>
        <div class="auth-title">Join PocketText</div>
        <div class="auth-sub">You'll get a 4-digit number instantly</div>
        <div class="error-msg" id="reg-error"></div>
        <label>Username</label>
        <input
          type="text"
          id="reg-username"
          placeholder="your_username"
          autocomplete="username"
        />
        <label>Display Name</label>
        <input type="text" id="reg-name" placeholder="Your Name" />
        <label>Password</label>
        <input
          type="password"
          id="reg-password"
          placeholder="••••••••"
          autocomplete="new-password"
        />
        <button class="btn btn-primary" onclick="registerUser()">
          Create Account
        </button>
        <button class="btn btn-ghost" onclick="showLogin()">
          Already have an account →
        </button>
      </div>
    </div>

    <div id="app-screen" class="screen">
      <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <div>
            <div class="sidebar-logo">Pocket<span>Text</span></div>
            <div
              style="font-size: 12px; color: var(--muted); margin-top: 2px"
              id="user-display-name"
            ></div>
          </div>
          <div class="my-number" id="my-number-badge">####</div>
        </div>
        <div class="sidebar-tabs">
          <button
            class="tab-btn active"
            onclick="switchTab('chats')"
            id="tab-chats"
          >
            Chats
          </button>
          <button
            class="tab-btn"
            onclick="switchTab('contacts')"
            id="tab-contacts"
          >
            Contacts
          </button>
        </div>
        <div class="sidebar-content" id="sidebar-content">
          <div
            style="
              color: var(--muted);
              font-size: 13px;
              text-align: center;
              padding: 24px 0;
            "
          >
            Loading...
          </div>
        </div>
      </div>

      <div class="chat-panel" id="chat-panel">
        <div class="empty-state" id="empty-state">
          <div class="empty-icon">💬</div>
          <div class="empty-title">No chat selected</div>
          <div class="empty-sub">
            Pick a contact from the sidebar to start texting
          </div>
        </div>

        <div
          id="active-chat"
          style="display: none; flex-direction: column; height: 100%"
        >
          <div class="chat-header">
            <div class="avatar" id="chat-avatar">?</div>
            <div class="chat-header-info">
              <div class="chat-contact-name" id="chat-contact-name">—</div>
              <div class="chat-contact-num" id="chat-contact-num">—</div>
            </div>
            <div class="online-dot" title="Realtime"></div>
          </div>

          <div class="chat-messages" id="chat-messages"></div>

          <div class="chat-input-stack">
            <div
              class="attachment-preview"
              id="attachment-preview"
              style="display: none"
            ></div>
            <div class="chat-input-area">
              <div class="chat-input-wrap">
                <button
                  class="attach-btn"
                  onclick="openImagePicker()"
                  title="Attach image"
                  type="button"
                >
                  <svg
                    width="18"
                    height="18"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2.2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path
                      d="M21 12.5V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h6.5"
                    ></path>
                    <path d="M17 3h4v4"></path>
                    <path d="M16 8 5 19"></path>
                  </svg>
                </button>
                <textarea
                  class="chat-input"
                  id="message-input"
                  placeholder="Type a message…"
                  rows="1"
                  onkeydown="handleKey(event)"
                  oninput="autoResize(this)"
                ></textarea>
              </div>
              <button class="send-btn" onclick="sendMessage()">
                <svg
                  width="20"
                  height="20"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2.5"
                  viewBox="0 0 24 24"
                >
                  <line x1="22" y1="2" x2="11" y2="13"></line>
                  <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="modal-overlay" id="add-contact-modal">
      <div class="modal">
        <h3>Add Contact</h3>
        <div class="error-msg" id="contact-error"></div>
        <label>Their 4-Digit Number</label>
        <input
          type="text"
          id="contact-number"
          placeholder="1234"
          maxlength="4"
          style="font-size: 24px; letter-spacing: 4px; text-align: center"
          oninput="this.value = this.value.replace(/\D/g, '')"
        />
        <label>Nickname (optional)</label>
        <input
          type="text"
          id="contact-nickname"
          placeholder="Leave blank to use their name"
        />
        <div class="modal-actions">
          <button class="btn btn-ghost btn-sm" onclick="closeModal()">
            Cancel
          </button>
          <button class="btn btn-primary btn-sm" onclick="addContact()">
            Add Contact
          </button>
        </div>
      </div>
    </div>

    <input type="file" id="image-input" accept="image/*" hidden />

    <div class="toast" id="toast"></div>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
      import {
        getDatabase,
        ref as dbRef,
        set,
        get,
        push,
        onValue,
        update,
      } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
      import {
        getStorage,
        ref as storageRef,
        uploadBytes,
        getDownloadURL,
      } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";

      const firebaseConfig = {
        apiKey: "AIzaSyD3zWKNZ4HIyw1rdt2w0iX4sT8J0FpDugg",
        authDomain: "pockettext-1a2bd.firebaseapp.com",
        databaseURL: "https://pockettext-1a2bd-default-rtdb.firebaseio.com",
        projectId: "pockettext-1a2bd",
        storageBucket: "pockettext-1a2bd.appspot.com",
        messagingSenderId: "46478191144",
        appId: "1:46478191144:web:3483717ba1aa78ca4c231d",
        measurementId: "G-40PRTD6Y56",
      };

      const app = initializeApp(firebaseConfig);
      const db = getDatabase(app);
      const storage = getStorage(app);

      let currentUser = null;
      let contacts = {};
      let activeConvo = null;
      let activeTab = "chats";
      let convoListeners = {};
      let unreadCounts = {};
      let selectedImageFile = null;
      let selectedImagePreviewUrl = null;

      const $ = (id) => document.getElementById(id);

      function showToast(msg) {
        const t = $("toast");
        t.textContent = msg;
        t.classList.add("show");
        setTimeout(() => t.classList.remove("show"), 2500);
      }

      function hashPassword(pw) {
        let h = 0;
        for (let i = 0; i < pw.length; i++) {
          h = (Math.imul(31, h) + pw.charCodeAt(i)) | 0;
        }
        return h.toString(36);
      }

      function convoId(a, b) {
        return [a, b].sort().join("_");
      }

      function timeStr(ts) {
        if (!ts) return "";
        const d = new Date(ts);
        const now = new Date();
        const diffDays = Math.floor((now - d) / 86400000);
        if (diffDays === 0)
          return d.toLocaleTimeString([], {
            hour: "2-digit",
            minute: "2-digit",
          });
        if (diffDays === 1) return "Yesterday";
        return d.toLocaleDateString([], { month: "short", day: "numeric" });
      }

      function getInitials(name) {
        return (name || "?")
          .split(" ")
          .map((w) => w[0])
          .join("")
          .toUpperCase()
          .slice(0, 2);
      }

      async function assignNumber() {
        const taken = new Set();
        const snap = await get(dbRef(db, "users"));
        if (snap.exists()) {
          Object.values(snap.val()).forEach((u) => taken.add(u.number));
        }
        let num;
        do {
          num = String(Math.floor(1000 + Math.random() * 9000));
        } while (taken.has(num));
        return num;
      }

      function escapeHtml(str = "") {
        return String(str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function escapeAttr(str = "") {
        return escapeHtml(str).replace(/`/g, "&#96;");
      }

      function extractFirstUrl(text) {
        if (!text) return null;
        const match = text.match(/https?:\/\/[^\s<>"')\]]+/i);
        if (!match) return null;
        return match[0].replace(/[.,!?;:]+$/g, "");
      }

      function renderTextWithLinks(text) {
        const safe = escapeHtml(text || "");
        const urlRegex = /(https?:\/\/[^\s<>"')\]]+)/gi;
        return safe.replace(urlRegex, (raw) => {
          const clean = raw.replace(/[.,!?;:]+$/g, "");
          const trailing = raw.slice(clean.length);
          return `<a href="${escapeAttr(clean)}" target="_blank" rel="noopener noreferrer" class="message-link">${escapeHtml(clean)}</a>${escapeHtml(trailing)}`;
        });
      }

      function safeHost(url) {
        try {
          return new URL(url).hostname.replace(/^www\./, "");
        } catch {
          return url;
        }
      }

      async function fetchLinkPreview(url) {
        try {
          const endpoint = `https://api.microlink.io/?url=${encodeURIComponent(url)}`;
          const res = await fetch(endpoint, { method: "GET" });
          const json = await res.json();
          const data = json?.data || {};
          return {
            url,
            title: data.title || safeHost(url),
            description: data.description || "",
            image: data.image?.url || data.image || "",
            siteName: data.publisher || data.siteName || safeHost(url),
          };
        } catch {
          return {
            url,
            title: safeHost(url),
            description: "",
            image: "",
            siteName: safeHost(url),
          };
        }
      }

      function renderLinkPreview(preview) {
        if (!preview || !preview.url) return "";
        const title = escapeHtml(preview.title || preview.url);
        const desc = escapeHtml(preview.description || "");
        const site = escapeHtml(preview.siteName || safeHost(preview.url));
        const img = preview.image
          ? `<img src="${escapeAttr(preview.image)}" alt="" class="link-preview-image">`
          : "";
        return `
      <div class="link-preview">
        ${img}
        <div class="link-preview-body">
          <div class="link-preview-domain">${site}</div>
          <div class="link-preview-title">${title}</div>
          ${desc ? `<div class="link-preview-desc">${desc}</div>` : ""}
        </div>
      </div>
    `;
      }

      function clearAttachment() {
        selectedImageFile = null;
        if (selectedImagePreviewUrl) {
          URL.revokeObjectURL(selectedImagePreviewUrl);
          selectedImagePreviewUrl = null;
        }
        $("image-input").value = "";
        $("attachment-preview").style.display = "none";
        $("attachment-preview").innerHTML = "";
      }

      function showAttachmentPreview(file) {
        const holder = $("attachment-preview");
        holder.style.display = "block";
        const objectUrl = URL.createObjectURL(file);
        selectedImagePreviewUrl = objectUrl;
        holder.innerHTML = `
      <div class="attachment-chip">
        <img src="${escapeAttr(objectUrl)}" class="attachment-thumb" alt="selected image">
        <div class="attachment-meta">
          <div class="attachment-name">${escapeHtml(file.name)}</div>
          <div class="attachment-sub">${escapeHtml(Math.round(file.size / 1024))} KB</div>
        </div>
        <button class="attachment-remove" type="button" onclick="removeSelectedImage()">×</button>
      </div>
    `;
      }

      window.removeSelectedImage = function () {
        clearAttachment();
      };

      window.openImagePicker = function () {
        $("image-input").click();
      };

      $("image-input").addEventListener("change", (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        if (!file.type.startsWith("image/")) {
          showToast("please choose an image file.");
          return;
        }
        selectedImageFile = file;
        showAttachmentPreview(file);
      });

      window.registerUser = async function () {
        const username = $("reg-username").value.trim().toLowerCase();
        const name = $("reg-name").value.trim();
        const password = $("reg-password").value;
        const errEl = $("reg-error");

        if (!username || !name || !password) {
          errEl.textContent = "All fields required.";
          return;
        }
        if (username.length < 3) {
          errEl.textContent = "Username must be 3+ characters.";
          return;
        }
        if (password.length < 4) {
          errEl.textContent = "Password must be 4+ characters.";
          return;
        }

        errEl.textContent = "";

        const snap = await get(dbRef(db, `users/${username}`));
        if (snap.exists()) {
          errEl.textContent = "Username already taken.";
          return;
        }

        const number = await assignNumber();
        const userData = {
          username,
          name,
          number,
          passwordHash: hashPassword(password),
        };

        await set(dbRef(db, `users/${username}`), userData);
        await loginSuccess(userData);
      };

      window.loginUser = async function () {
        const username = $("login-username").value.trim().toLowerCase();
        const password = $("login-password").value;
        const errEl = $("login-error");

        if (!username || !password) {
          errEl.textContent = "Enter username & password.";
          return;
        }
        errEl.textContent = "";

        const snap = await get(dbRef(db, `users/${username}`));
        if (!snap.exists()) {
          errEl.textContent = "User not found.";
          return;
        }

        const data = snap.val();
        if (data.passwordHash !== hashPassword(password)) {
          errEl.textContent = "Wrong password.";
          return;
        }

        await loginSuccess(data);
      };

      async function loginSuccess(userData) {
        currentUser = userData;
        localStorage.setItem("pt_user", JSON.stringify(userData));
        showApp();
      }

      function showApp() {
        $("auth-screen").classList.remove("active");
        $("app-screen").classList.add("active");
        $("my-number-badge").textContent = "#" + currentUser.number;
        $("user-display-name").textContent = currentUser.name;
        loadContacts();
        listenForIncoming();
      }

      async function loadContacts() {
        const snap = await get(dbRef(db, `contacts/${currentUser.username}`));
        contacts = {};
        if (snap.exists()) contacts = snap.val();
        renderSidebar();
      }

      function listenForIncoming() {
        onValue(dbRef(db, "convos"), (snap) => {
          if (!snap.exists()) return;
          const all = snap.val();

          Object.entries(all).forEach(([cid, msgs]) => {
            if (!cid.includes(currentUser.number)) return;
            let unread = 0;
            Object.values(msgs).forEach((m) => {
              if (m.from !== currentUser.number && !m.read) unread++;
            });
            const otherNum = cid
              .split("_")
              .find((n) => n !== currentUser.number);
            unreadCounts[otherNum] = unread;
          });

          renderSidebar();
        });
      }

      function renderSidebar() {
        const el = $("sidebar-content");

        if (activeTab === "chats") {
          const contactList = Object.values(contacts);
          if (contactList.length === 0) {
            el.innerHTML = `<div style="color:var(--muted);font-size:13px;text-align:center;padding:24px 0">No contacts yet.<br>Add someone to start texting!</div>`;
          } else {
            el.innerHTML = contactList
              .map((c) => {
                const unread = unreadCounts[c.number] || 0;
                const displayName = c.nickname || c.name;
                return `
            <div class="contact-item ${activeConvo === c.number ? "active" : ""}" onclick="openChat('${c.number}')">
              <div class="avatar">${getInitials(displayName)}</div>
              <div class="contact-info">
                <div class="contact-name">${escapeHtml(displayName)}</div>
                <div class="contact-preview">#${escapeHtml(c.number)}</div>
              </div>
              ${unread > 0 ? `<div class="unread-badge">${unread}</div>` : ""}
            </div>`;
              })
              .join("");
          }
          el.innerHTML += `<button class="add-contact-btn" onclick="openAddContact()">+ Add Contact</button>`;
        } else {
          const contactList = Object.values(contacts);
          if (contactList.length === 0) {
            el.innerHTML = `<div style="color:var(--muted);font-size:13px;text-align:center;padding:24px 0">No contacts yet.</div>`;
          } else {
            el.innerHTML = contactList
              .map((c) => {
                const displayName = c.nickname || c.name;
                return `
            <div class="contact-item" onclick="openChat('${c.number}')">
              <div class="avatar">${getInitials(displayName)}</div>
              <div class="contact-info">
                <div class="contact-name">${escapeHtml(displayName)}</div>
                <div class="contact-num">#${escapeHtml(c.number)}</div>
              </div>
            </div>`;
              })
              .join("");
          }
          el.innerHTML += `<button class="add-contact-btn" onclick="openAddContact()">+ Add Contact</button>`;
        }
      }

      window.addContact = async function () {
        const num = $("contact-number").value.trim();
        const nick = $("contact-nickname").value.trim();
        const errEl = $("contact-error");

        if (num.length !== 4) {
          errEl.textContent = "Enter a valid 4-digit number.";
          return;
        }
        if (num === currentUser.number) {
          errEl.textContent = "That's your own number!";
          return;
        }

        const snap = await get(dbRef(db, "users"));
        if (!snap.exists()) {
          errEl.textContent = "No users found.";
          return;
        }

        let found = null;
        Object.values(snap.val()).forEach((u) => {
          if (u.number === num) found = u;
        });

        if (!found) {
          errEl.textContent = "No user with that number.";
          return;
        }

        contacts[num] = { number: num, name: found.name, nickname: nick || "" };
        await set(
          dbRef(db, `contacts/${currentUser.username}/${num}`),
          contacts[num],
        );

        closeModal();
        showToast(`${nick || found.name} added!`);
        renderSidebar();
      };

      window.openChat = async function (num) {
        activeConvo = num;
        const contact = contacts[num];
        if (!contact) return;

        const displayName = contact.nickname || contact.name;
        $("empty-state").style.display = "none";
        $("active-chat").style.display = "flex";
        $("chat-avatar").textContent = getInitials(displayName);
        $("chat-contact-name").textContent = displayName;
        $("chat-contact-num").textContent = "#" + contact.number;

        renderSidebar();

        if (convoListeners[num]) convoListeners[num]();

        const cid = convoId(currentUser.number, num);

        convoListeners[num] = onValue(
          dbRef(db, `convos/${cid}`),
          async (snap) => {
            const msgs = snap.exists() ? snap.val() : {};
            renderMessages(msgs);

            const updates = {};
            Object.entries(msgs).forEach(([k, m]) => {
              if (m.from !== currentUser.number && !m.read) {
                updates[`convos/${cid}/${k}/read`] = true;
              }
            });

            if (Object.keys(updates).length > 0) {
              await update(dbRef(db), updates);
              unreadCounts[num] = 0;
              renderSidebar();
            }
          },
        );
      };

      function renderMessages(msgs) {
        const el = $("chat-messages");
        const sorted = Object.values(msgs).sort(
          (a, b) => (a.ts || 0) - (b.ts || 0),
        );
        let lastDate = "";

        el.innerHTML = sorted
          .map((m) => {
            const out = m.from === currentUser.number;
            const d = new Date(m.ts || Date.now());
            const dateKey = d.toDateString();
            let divider = "";
            if (dateKey !== lastDate) {
              lastDate = dateKey;
              const label =
                dateKey === new Date().toDateString()
                  ? "Today"
                  : d.toLocaleDateString([], {
                      weekday: "long",
                      month: "short",
                      day: "numeric",
                    });
              divider = `<div class="date-divider">${escapeHtml(label)}</div>`;
            }

            let contentHtml = "";

            if (m.type === "image" && m.imageUrl) {
              contentHtml += `<img src="${escapeAttr(m.imageUrl)}" alt="sent image" class="image-message">`;
              if (m.caption) {
                contentHtml += `<div class="caption-spacer"></div><div class="message-text">${renderTextWithLinks(m.caption)}</div>`;
              }
            } else {
              if (m.text) {
                contentHtml += `<div class="message-text">${renderTextWithLinks(m.text)}</div>`;
              }
            }

            if (m.linkPreview && m.linkPreview.url) {
              contentHtml += renderLinkPreview(m.linkPreview);
            }

            return `${divider}
        <div class="msg-row ${out ? "outgoing" : "incoming"}">
          <div class="bubble">${contentHtml || "&nbsp;"}</div>
          <div class="msg-time">${escapeHtml(timeStr(m.ts))}</div>
        </div>`;
          })
          .join("");

        el.scrollTop = el.scrollHeight;
      }

      async function uploadSelectedImage(cid) {
        if (!selectedImageFile) return null;

        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = function (e) {
            resolve(e.target.result); // this is the base64 string
          };
          reader.onerror = reject;
          reader.readAsDataURL(selectedImageFile);
        });
      }

      window.sendMessage = async function () {
        const input = $("message-input");
        const text = input.value.trim();

        if (!activeConvo && !selectedImageFile) return;
        if (!text && !selectedImageFile) return;

        const cid = convoId(currentUser.number, activeConvo);

        let linkPreview = null;
        const firstUrl = extractFirstUrl(text);
        if (firstUrl) {
          linkPreview = await fetchLinkPreview(firstUrl);
        }

        let imageUrl = null;
        if (selectedImageFile) {
          try {
            imageUrl = await uploadSelectedImage(cid);
          } catch (err) {
            console.error(err);
            showToast("image upload failed.");
            return;
          }
        }

        const message = {
          from: currentUser.number,
          ts: Date.now(),
          read: false,
        };

        if (imageUrl) {
          message.type = "image";
          message.imageUrl = imageUrl;
          if (text) message.caption = text;
          if (linkPreview) message.linkPreview = linkPreview;
        } else {
          message.type = "text";
          message.text = text;
          if (linkPreview) message.linkPreview = linkPreview;
        }

        await push(dbRef(db, `convos/${cid}`), message);

        input.value = "";
        input.style.height = "auto";
        clearAttachment();
      };

      window.handleKey = function (e) {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      };

      window.autoResize = function (el) {
        el.style.height = "auto";
        el.style.height = Math.min(el.scrollHeight, 120) + "px";
      };

      window.switchTab = function (tab) {
        activeTab = tab;
        $("tab-chats").classList.toggle("active", tab === "chats");
        $("tab-contacts").classList.toggle("active", tab === "contacts");
        renderSidebar();
      };

      window.openAddContact = function () {
        $("contact-number").value = "";
        $("contact-nickname").value = "";
        $("contact-error").textContent = "";
        $("add-contact-modal").classList.add("open");
      };

      window.closeModal = function () {
        $("add-contact-modal").classList.remove("open");
      };

      window.showRegister = function () {
        $("login-card").style.display = "none";
        $("register-card").style.display = "block";
      };

      window.showLogin = function () {
        $("register-card").style.display = "none";
        $("login-card").style.display = "block";
      };

      document.addEventListener("click", (e) => {
        const modal = $("add-contact-modal");
        if (e.target === modal) closeModal();
      });

      const saved = localStorage.getItem("pt_user");
      if (saved) {
        try {
          currentUser = JSON.parse(saved);
          get(dbRef(db, `users/${currentUser.username}`)).then((snap) => {
            if (snap.exists()) {
              currentUser = snap.val();
              localStorage.setItem("pt_user", JSON.stringify(currentUser));
            } else {
              localStorage.removeItem("pt_user");
            }
            showApp();
          });
        } catch {
          localStorage.removeItem("pt_user");
        }
      }
    </script>
  </body>
</html>
